<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="applianceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="350" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">
    OÙ TROUVER LE NUMÉRO DE SÉRIE ? / أين تجد الرقم التسلسلي؟
  </text>
  <text x="350" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    Sur la plaque signalétique située à l'arrière ou sur le côté de l'appareil
  </text>

  <!-- Left: Appliance Back Illustration -->
  <g transform="translate(40, 80)">
    <!-- Water heater cylinder outline -->
    <rect x="30" y="20" width="160" height="260" rx="30" fill="url(#applianceGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <!-- Top bracket -->
    <rect x="70" y="8" width="80" height="14" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Wall mount plate -->
    <rect x="50" y="50" width="120" height="24" rx="4" fill="#1e293b" opacity="0.6"/>
    <circle cx="65" cy="62" r="3" fill="#94a3b8"/>
    <circle cx="155" cy="62" r="3" fill="#94a3b8"/>
    <!-- Bottom pipes -->
    <rect x="70" y="280" width="18" height="25" rx="3" fill="#3b82f6"/>
    <rect x="132" y="280" width="18" height="25" rx="3" fill="#ef4444"/>
    <text x="79" y="318" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="9" font-weight="600">EAU</text>
    <text x="141" y="318" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="600">CHAUDE</text>

    <!-- Metal plate on appliance (magnified source) -->
    <rect x="65" y="140" width="90" height="55" rx="3" fill="#cbd5e1" stroke="#3b82f6" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Screws -->
    <circle cx="69" cy="144" r="1.5" fill="#475569"/>
    <circle cx="151" cy="144" r="1.5" fill="#475569"/>
    <circle cx="69" cy="191" r="1.5" fill="#475569"/>
    <circle cx="151" cy="191" r="1.5" fill="#475569"/>
    <!-- Miniature text inside mini-plate -->
    <rect x="75" y="150" width="70" height="4" rx="1" fill="#64748b"/>
    <rect x="75" y="158" width="50" height="3" rx="1" fill="#64748b"/>
    <rect x="73" y="166" width="74" height="14" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="110" y="176" text-anchor="middle" fill="#1d4ed8" font-family="monospace" font-size="7" font-weight="bold">S/N: PC...</text>

    <!-- Label below appliance -->
    <text x="110" y="350" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500">
      Vue arrière / جانب الجهاز
    </text>
  </g>

  <!-- Connecting dashed arrow to zoomed plate -->
  <path d="M 205 240 C 235 240, 245 220, 275 220" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="280,220 270,215 270,225" fill="#3b82f6"/>

  <!-- Right: Zoomed Specification Nameplate -->
  <g transform="translate(290, 85)" filter="url(#shadow)">
    <!-- Plate base -->
    <rect x="0" y="0" width="370" height="280" rx="8" fill="url(#plateGrad)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Screws at corners -->
    <circle cx="14" cy="14" r="3.5" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <circle cx="356" cy="14" r="3.5" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <circle cx="14" cy="266" r="3.5" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <circle cx="356" cy="266" r="3.5" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

    <!-- Plate Header -->
    <rect x="18" y="18" width="334" height="36" rx="4" fill="#1e293b"/>
    <text x="30" y="41" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      CHAUFFE-EAU ÉLECTRIQUE / CE
    </text>
    <text x="340" y="41" text-anchor="end" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
      MADE IN MOROCCO
    </text>

    <!-- Specs Grid -->
    <text x="24" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MODÈLE / MODEL :</text>
    <text x="140" y="78" fill="#0f172a" font-family="monospace" font-size="11" font-weight="700">PRO-ECO 80L</text>

    <text x="24" y="100" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PUISSANCE / POWER :</text>
    <text x="155" y="100" fill="#0f172a" font-family="monospace" font-size="11" font-weight="700">1500 W - 230V~</text>

    <text x="24" y="122" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRESSION MAX :</text>
    <text x="140" y="122" fill="#0f172a" font-family="monospace" font-size="11" font-weight="700">8 bar (0.8 MPa)</text>

    <!-- HIGHLIGHTED SERIAL NUMBER BOX -->
    <g transform="translate(18, 140)">
      <rect x="0" y="0" width="334" height="82" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#glow)"/>
      
      <!-- Badge label -->
      <rect x="12" y="-10" width="220" height="20" rx="10" fill="#2563eb"/>
      <text x="122" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">
        ★ NUMÉRO DE SÉRIE / الرقم التسلسلي
      </text>

      <!-- Serial Value -->
      <text x="20" y="38" fill="#1e3a8a" font-family="Courier, monospace" font-size="20" font-weight="800" letter-spacing="2">
        PC202508300133
      </text>

      <!-- Barcode simulation -->
      <g transform="translate(20, 48)">
        <rect x="0" y="0" width="3" height="22" fill="#0f172a"/>
        <rect x="5" y="0" width="1" height="22" fill="#0f172a"/>
        <rect x="8" y="0" width="4" height="22" fill="#0f172a"/>
        <rect x="15" y="0" width="2" height="22" fill="#0f172a"/>
        <rect x="19" y="0" width="1" height="22" fill="#0f172a"/>
        <rect x="22" y="0" width="3" height="22" fill="#0f172a"/>
        <rect x="28" y="0" width="2" height="22" fill="#0f172a"/>
        <rect x="33" y="0" width="4" height="22" fill="#0f172a"/>
        <rect x="40" y="0" width="1" height="22" fill="#0f172a"/>
        <rect x="44" y="0" width="3" height="22" fill="#0f172a"/>
        <rect x="50" y="0" width="2" height="22" fill="#0f172a"/>
        <rect x="55" y="0" width="4" height="22" fill="#0f172a"/>
        <rect x="62" y="0" width="2" height="22" fill="#0f172a"/>
        <rect x="66" y="0" width="1" height="22" fill="#0f172a"/>
        <rect x="70" y="0" width="3" height="22" fill="#0f172a"/>
        <rect x="76" y="0" width="3" height="22" fill="#0f172a"/>
        <rect x="82" y="0" width="1" height="22" fill="#0f172a"/>
        <rect x="85" y="0" width="4" height="22" fill="#0f172a"/>
        <rect x="92" y="0" width="2" height="22" fill="#0f172a"/>
        <rect x="97" y="0" width="2" height="22" fill="#0f172a"/>
        <rect x="102" y="0" width="3" height="22" fill="#0f172a"/>
        <rect x="108" y="0" width="1" height="22" fill="#0f172a"/>
        <rect x="112" y="0" width="4" height="22" fill="#0f172a"/>
        <rect x="119" y="0" width="2" height="22" fill="#0f172a"/>
        <rect x="124" y="0" width="3" height="22" fill="#0f172a"/>
        <rect x="130" y="0" width="2" height="22" fill="#0f172a"/>
        <rect x="135" y="0" width="1" height="22" fill="#0f172a"/>
        <rect x="139" y="0" width="3" height="22" fill="#0f172a"/>
      </g>

      <text x="175" y="62" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">
        Copiez exactement ce code
      </text>
    </g>

    <!-- Bottom note -->
    <text x="185" y="250" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-style="italic">
      Plaque signalétique métallique fixée sur le corps de l'appareil
    </text>
  </g>

  <!-- Footer Help Tip -->
  <text x="350" y="398" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">
    💡 Astuce : Prenez une photo de cette plaque si le numéro est difficile à lire.
  </text>
</svg>
