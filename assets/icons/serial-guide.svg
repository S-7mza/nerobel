<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" fill="none">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3436" />
      <stop offset="50%" stop-color="#1E272E" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="420" height="240" rx="16" fill="#0C0C0E"/>
  <rect x="20" y="20" width="380" height="200" rx="12" fill="url(#metal)" stroke="#3AA0E6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Metal Nameplate -->
  <rect x="50" y="45" width="320" height="150" rx="8" fill="#141417" stroke="#2A2A31" stroke-width="2"/>
  <circle cx="62" cy="57" r="4" fill="#8A8F99"/>
  <circle cx="358" cy="57" r="4" fill="#8A8F99"/>
  <circle cx="62" cy="183" r="4" fill="#8A8F99"/>
  <circle cx="358" cy="183" r="4" fill="#8A8F99"/>

  <text x="75" y="75" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#3AA0E6">NEROBEL APPLIANCE SPECIFICATION</text>
  <text x="75" y="96" font-family="'Inter', sans-serif" font-size="11" fill="#8A8F99">Model: THEROS DUOSLIM 80L · Made in Morocco / CE</text>

  <!-- Serial Number Highlight Box -->
  <rect x="75" y="112" width="270" height="42" rx="6" fill="rgba(58,160,230,0.12)" stroke="#3AA0E6" stroke-width="2"/>
  <text x="88" y="128" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#3AA0E6">NUMÉRO DE SÉRIE / SERIAL NO.</text>
  <text x="88" y="146" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="2">PC202604150892</text>

  <!-- Barcode Representation -->
  <g transform="translate(75, 162)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#8A8F99" stroke-width="2"/>
    <line x1="4" y1="0" x2="4" y2="18" stroke="#8A8F99" stroke-width="1"/>
    <line x1="8" y1="0" x2="8" y2="18" stroke="#8A8F99" stroke-width="3"/>
    <line x1="14" y1="0" x2="14" y2="18" stroke="#8A8F99" stroke-width="1"/>
    <line x1="18" y1="0" x2="18" y2="18" stroke="#8A8F99" stroke-width="2"/>
    <line x1="24" y1="0" x2="24" y2="18" stroke="#8A8F99" stroke-width="4"/>
    <line x1="32" y1="0" x2="32" y2="18" stroke="#8A8F99" stroke-width="2"/>
    <line x1="38" y1="0" x2="38" y2="18" stroke="#8A8F99" stroke-width="1"/>
    <line x1="44" y1="0" x2="44" y2="18" stroke="#8A8F99" stroke-width="3"/>
    <line x1="52" y1="0" x2="52" y2="18" stroke="#8A8F99" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="18" stroke="#8A8F99" stroke-width="1"/>
    <line x1="66" y1="0" x2="66" y2="18" stroke="#8A8F99" stroke-width="4"/>
    <line x1="74" y1="0" x2="74" y2="18" stroke="#8A8F99" stroke-width="2"/>
  </g>
  <text x="160" y="176" font-family="'Inter', sans-serif" font-size="10" fill="#C9A96A">★ Plaque située au bas ou sur le flanc de l'appareil</text>
</svg>
