<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="opt2Bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>
    <linearGradient id="opt2Border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#1B3A57"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="opt2Laser" x1="4" y1="46" x2="60" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Sleek tech squircle tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#opt2Bg)" stroke="url(#opt2Border)" stroke-width="2"/>
  <!-- Pure White Monolithic N -->
  <polygon points="16.38,11.0 8.2,51.0 21.34,50.71 25.14,32.61 36.82,51.0 47.62,51.0 55.8,11.29 42.66,11.29 38.57,29.39 27.18,11.0" fill="#FFFFFF" />
  <!-- Signature Laser Horizon Line cutting across the base -->
  <line x1="6" y1="47" x2="58" y2="47" stroke="url(#opt2Laser)" stroke-width="2.5" filter="url(#laserGlow)" />
  <!-- Laser Center Pulsar -->
  <circle cx="32" cy="47" r="2.2" fill="#FFFFFF" />
</svg>